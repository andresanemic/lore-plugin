name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Several regression tests compare the current tree with published tag anchors.
          fetch-depth: 0
      - name: Fetch the canonical Vespi kernel source
        shell: pwsh
        run: |
          $kernel = Join-Path $env:RUNNER_TEMP "vespi-kernel"
          git init $kernel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $kernel remote add origin https://github.com/andresanemic/vespi.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $kernel fetch --depth=1 origin 39d45733839d0a05f60248fc6e5b81c892c464f8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $kernel checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run complete test suite
        run: npm test
        env:
          # Keep synthetic HOME fixtures and perimeter checks on one physical temp path.
          TEMP: ${{ runner.os == 'Windows' && runner.temp || '' }}
          TMP: ${{ runner.os == 'Windows' && runner.temp || '' }}
          TMPDIR: ${{ runner.os == 'macOS' && runner.temp || '' }}
          VESPI_KERNEL_DIR: ${{ runner.temp }}/vespi-kernel
          VESPI_KERNEL_ROOT: ${{ runner.temp }}/vespi-kernel
